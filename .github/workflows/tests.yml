# Runs the Linux test suite on every push and on demand.
# Linux test paketini her gönderimde ve istendiğinde çalıştırır.
name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    if: github.ref != 'refs/heads/build/windows-yamali-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-core.txt pytest
      - run: python -m pytest -q -p no:cacheprovider tests
